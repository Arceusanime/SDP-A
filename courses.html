<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Courses | Student Management System</title>
  <link rel="icon" type="image/png" href="assets/fav.png">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary px-4">
  <div class="d-flex align-items-center">
    <a href="dashboard.html"><img src="https://files.reva.ac.in/uploads/images/1636545030_eb8e424b8c32ef9fc017.png" alt="SMS Logo" class="navbar-logo-img me-2"></a>
    <span class="navbar-brand mb-0 h1">
      Student Management System
    </span>
  </div>
</nav>


<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-2 bg-light vh-100 p-3">
      <ul class="nav flex-column">
        <li class="nav-item mb-2">
          <a class="nav-link" href="dashboard.html">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" href="students.html">
            <i class="bi bi-people"></i> Students
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link active" href="courses.html">
            <i class="bi bi-book"></i> Courses
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-danger" href="index.html">
            <i class="bi bi-box-arrow-right"></i> Logout
          </a>
        </li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 p-4">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Course Management</h3>
      </div>

      <!-- Add Course Section -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="mb-3">Add New Course</h5>

          <form class="row g-3">
            <div class="col-md-8">
              <input type="text" class="form-control" placeholder="Course Name" required>
            </div>
            <div class="col-md-4">
              <button class="btn btn-primary w-100">
                Add Course
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Course Table -->
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Course Name</th>
              <th style="width: 150px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>BCA</td>
              <td>
                <a href="#" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
            <tr>
              <td>B.Tech</td>
              <td>
                <a href="#" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
            <tr>
              <td>MCA</td>
              <td>
                <a href="#" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>
</div>

</body>
</html>
