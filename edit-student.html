<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Student | Student Management System</title>
  <link rel="icon" type="image/png" href="assets/fav.png">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary px-4">
  <div class="d-flex align-items-center">
    <a href="dashboard.html"><img src="https://files.reva.ac.in/uploads/images/1636545030_eb8e424b8c32ef9fc017.png" alt="SMS Logo" class="navbar-logo-img me-2"></a>
    <span class="navbar-brand mb-0 h1">
      Student Management System
    </span>
  </div>
</nav>


<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-2 bg-light vh-100 p-3">
      <ul class="nav flex-column">
        <li class="nav-item mb-2">
          <a class="nav-link" href="dashboard.html">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link active" href="students.html">
            <i class="bi bi-people"></i> Students
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" href="courses.html">
            <i class="bi bi-book"></i> Courses
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-danger" href="index.html">
            <i class="bi bi-box-arrow-right"></i> Logout
          </a>
        </li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 p-4">

      <h3 class="mb-4">Edit Student</h3>

      <!-- Success Alert (Optional for Screenshot) -->
      <!--
      <div class="alert alert-success">
        Student updated successfully!
      </div>
      -->

      <!-- Form -->
      <div class="row justify-content-center">
        <div class="col-md-6">

          <div class="card shadow-sm p-4">
            <form action="students.html">

              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" value="Rahul Sharma" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" value="rahul@example.com" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" class="form-control" value="20" required>
              </div>

              <div class="mb-4">
                <label class="form-label">Course</label>
                <select class="form-select" required>
                  <option>BCA</option>
                  <option selected>B.Tech</option>
                  <option>B.Sc</option>
                  <option>MCA</option>
                </select>
              </div>

              <div class="d-flex justify-content-between">
                <a href="students.html" class="btn btn-secondary">
                  Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                  Update
                </button>
              </div>

            </form>
          </div>

        </div>
      </div>

    </div>

  </div>
</div>

</body>
</html>
